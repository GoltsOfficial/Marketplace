{% extends "posts/base.html" %}

{% block title %}Регистрация — Marketplace{% endblock %}

{% block content %}
  <h1>Регистрация</h1>

  <div class="card" style="margin-top: 1rem; max-width: 400px;">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <p style="margin-top: 1rem;" class="meta">
      Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a>
    </p>
  </div>
{% endblock %}
